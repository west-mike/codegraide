[workspace]
members = [
    "crates/core",
    "crates/cli",
    "crates/analyzers/python",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
petgraph = { version = "=0.8.3", default-features = false, features = ["std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = "=0.8.23"
tree-sitter = "=0.26.11"
tree-sitter-python = "=0.25.0"
wait-timeout = "=0.2.1"
