<section class="stage" aria-label="Interactive dependency graph">
        <svg id="graph" role="img" aria-labelledby="graph-title graph-description">
          <title id="graph-title">Repository dependency graph</title>
          <desc id="graph-description">Arrows point from a file or module to a dependency. Select an arrow to inspect its import or include.</desc>
          <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"></path>
            </marker>
          </defs>
          <g id="viewport"><g id="edges"></g><g id="nodes"></g></g>
        </svg>
        <div id="graph-limit" class="graph-limit" hidden></div>
        <div id="trace-message" class="graph-hint" role="status"></div>
        <div class="empty-graph" id="empty-graph">No nodes match the selected filters.</div>
        <div class="legend" aria-label="Graph legend">
          <span class="legend-item"><span class="legend-dot" style="--legend-color:var(--local)"></span>Local</span>
          <span class="legend-item"><span class="legend-dot" style="--legend-color:var(--standard)"></span>Standard library</span>
          <span class="legend-item"><span class="legend-dot" style="--legend-color:var(--installed)"></span>Installed</span>
          <span class="legend-item"><span class="legend-dot" style="--legend-color:var(--unresolved)"></span>Unresolved</span>
          <span class="legend-item"><span class="legend-dot" style="--legend-color:var(--cycle)"></span>Cycle</span>
          <span class="legend-item"><span class="legend-line" style="border-color:var(--installed)"></span>Exact match</span>
          <span class="legend-item"><span class="legend-line" style="border-color:var(--ambiguous)"></span>Likely match</span>
          <span class="legend-item"><span class="legend-line dashed" style="border-color:var(--unresolved)"></span>Uncertain</span>
        </div>
      </section>
