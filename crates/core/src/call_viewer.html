    *{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:14px/1.45 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:6px 9px}button:hover{border-color:var(--accent)}button[aria-pressed="true"],button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
    header{height:58px;display:flex;align-items:center;gap:9px;padding:7px 12px;background:var(--panel);border-bottom:1px solid var(--line)}h1{font-size:16px;margin:0;white-space:nowrap}.subtitle{font-size:11px;color:var(--muted)}.brand-block{margin-right:auto}.brand{display:block;border:0;background:transparent;text-align:left;padding:0}.brand:hover,.brand:focus-visible{border-color:transparent;outline:0}.brand:hover h1,.brand:focus-visible h1{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1.5px}.header-control{height:34px;white-space:nowrap}.search-wrap{position:relative;width:min(540px,46vw)}#search{width:100%;height:38px;padding:8px 40px 8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}#search::-webkit-search-cancel-button{-webkit-appearance:none}.clear-search{position:absolute;right:7px;top:6px;width:27px;height:27px;padding:0;border:0;border-radius:5px;background:transparent;color:var(--muted);font-size:19px;line-height:25px}.clear-search:hover,.clear-search:focus-visible{background:var(--accent2);color:var(--text);outline:2px solid var(--accent);outline-offset:1px}.clear-search[hidden]{display:none}
    .layout{height:calc(100% - 58px);display:grid;grid-template-columns:var(--left-width,260px) minmax(360px,1fr) var(--right-width,360px)}.layout.hide-left{grid-template-columns:0 minmax(360px,1fr) var(--right-width,360px)}.layout.hide-right{grid-template-columns:var(--left-width,260px) minmax(360px,1fr) 0}.layout.hide-left.hide-right{grid-template-columns:0 minmax(360px,1fr) 0}.pane{position:relative;min-width:0;background:var(--panel)}.left{grid-column:1;border-right:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column}.center{grid-column:2}.right{grid-column:3;border-left:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column}.layout.hide-left .left,.layout.hide-right .right{display:none}.section{padding:12px;border-bottom:1px solid var(--line)}.tabs{overflow-x:auto;flex-shrink:0;display:flex;gap:0;padding:0;flex-wrap:nowrap}.tabs button{flex:1 0 auto;min-width:0;font-size:11px;padding:13px 4px;border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;color:var(--muted)}.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);background:var(--panel2)}.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}.controls{display:grid;gap:8px;flex-shrink:0;border-top:1px solid var(--line);border-bottom:0}.check{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
    #navigator{overflow:auto;min-height:0;flex:1;padding:8px 9px 18px}.nav-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 3px 5px}.nav-heading strong{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}.nav-item{display:block;width:100%;border:0;background:transparent;text-align:left;padding:7px 8px;margin:1px 0;overflow-wrap:anywhere}.nav-item:hover,.nav-item.selected{background:var(--accent2)}.nav-item small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.count{font-size:11px;color:var(--muted)}.notice,.empty{padding:10px;color:var(--muted);font-size:12px}.back,.show-more{border:0;background:transparent;color:var(--accent);padding:5px}.show-more{display:block;width:100%;margin-top:5px;text-align:left}
    .center{min-width:0;display:flex;flex-direction:column;overflow:hidden}.graph-toolbar{overflow-x:auto;flex-shrink:0;height:60px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:8px 10px}.graph-toolbar button{height:34px;white-space:nowrap}.graph-title{min-width:120px;margin-left:4px;margin-right:auto}.graph-title strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.graph-title span{color:var(--muted);font-size:11px}.depth-control{display:flex;align-items:center;gap:6px;white-space:nowrap}.depth-control input[type="range"]{width:92px;accent-color:var(--accent)}.depth-control input[type="number"]{width:48px;height:34px;padding:5px 7px;text-align:right;border:1px solid var(--line);border-radius:7px;background:var(--panel2)}.depth-control input[type="number"]{appearance:textfield}.depth-control input::-webkit-inner-spin-button,.depth-control input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}.icon{width:34px;padding:5px}.canvas-wrap{position:relative;flex:1;min-height:0;background:radial-gradient(circle at 1px 1px,var(--line) 1px,transparent 1.2px);background-size:22px 22px;overflow:hidden}#graphCanvas{width:100%;height:100%;display:block;touch-action:none}.graph-hint,.graph-legend{position:absolute;padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:color-mix(in srgb,var(--panel) 91%,transparent);color:var(--muted);font-size:11px;pointer-events:none}.graph-hint{left:12px;bottom:10px}.graph-legend{right:12px;bottom:10px}.legend-line{display:inline-block;width:18px;margin:0 5px 2px 9px;border-top:3px solid var(--exact)}.legend-line:first-child{margin-left:0}.legend-line.likely{border-color:var(--inferred)}.graph-node{cursor:pointer;user-select:none}.graph-node rect{fill:var(--panel);stroke:var(--line);stroke-width:1.4;filter:drop-shadow(0 4px 8px #10204018)}.graph-node.selected rect{stroke:var(--accent);stroke-width:3;fill:var(--accent2)}.graph-node.boundary rect{stroke:var(--uncertain);stroke-dasharray:5 3}.graph-node.noise rect{stroke:var(--contain);stroke-dasharray:2 3}.node-title{fill:var(--text);font-size:12px;font-weight:650}.node-meta{fill:var(--muted);font-size:10px}.layer-label{fill:var(--muted);font-size:11px;font-weight:700;text-anchor:middle;text-transform:uppercase;letter-spacing:.04em}.edge{fill:none;stroke:var(--exact);stroke-width:2.2;opacity:.9}.edge.inferred{stroke:var(--inferred)}.edge.uncertain{stroke:var(--uncertain)}.edge.contains{stroke:var(--contain)}.truncated{position:absolute;top:38px;left:50%;transform:translateX(-50%);padding:7px 10px;background:var(--panel);border:1px solid var(--line);border-radius:7px;color:var(--muted);font-size:11px;box-shadow:var(--shadow);pointer-events:none}
    .right-tabs{padding:9px 12px;border-bottom:1px solid var(--line);display:flex;gap:5px}.right-body{overflow:auto;flex:1}.right h2{font-size:16px;margin:0;overflow-wrap:anywhere}.right h3{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 8px}.symbol-meta{font-size:11px;color:var(--muted);margin:4px 0}.status-exact{--relation-color:var(--exact)}.status-inferred{--relation-color:var(--inferred)}.status-ambiguous,.status-unresolved,.status-unavailable,.status-external{--relation-color:var(--uncertain)}.relation-link{display:block;width:100%;border:0;border-radius:0;padding:7px 8px;text-align:left;overflow-wrap:anywhere;background:color-mix(in srgb,var(--relation-color) 15%,var(--panel));border-left:3px solid var(--relation-color)}.relation-link:hover{background:color-mix(in srgb,var(--relation-color) 26%,var(--panel))}.right .notice,.right .empty{padding:8px 0}.symbol-header>*{margin-left:0;padding-left:0}.signature,.location{font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);overflow-wrap:anywhere}.signature code{background:var(--code);border:1px solid var(--line);padding:2px 4px;font:inherit;box-decoration-break:clone}.stats{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin:0;font-size:12px}.stats dt{color:var(--muted)}.stats dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}.other-calls{margin-top:12px}.other-calls summary{cursor:pointer;color:var(--muted);font-size:12px;margin-bottom:8px}.links{display:grid;gap:3px}.link{border:0;background:transparent;text-align:left;padding:5px 4px;overflow-wrap:anywhere}.link:hover{background:var(--accent2)}.evidence{padding:8px 0;border-bottom:1px solid var(--line);font-size:12px}.evidence:last-child{border:0}.call-expression{font:11px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere}.projection{margin:7px 0 3px 12px;border-left:3px solid var(--accent);padding:8px;background:var(--panel2)}
    .source-tools{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:7px}.source-view{margin:0;background:var(--code);border:1px solid var(--line);border-radius:8px;overflow:auto;font:11px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace}.code-line{display:block;min-width:max-content;padding-right:12px}.code-line:hover{background:var(--accent2)}.line-no{display:inline-block;width:44px;padding-right:9px;text-align:right;color:var(--muted);user-select:none}.tok-comment{color:#6a9955}.tok-string{color:#ce6a50}.tok-keyword{color:#7b61d1;font-weight:600}.tok-type{color:#247e9d}.tok-number{color:#b06b20}.tok-preproc{color:#9b4f96}.tok-literal{color:#237c75}
    @media(max-width:1100px){.header-control{font-size:12px;padding-inline:7px}}@media(max-width:820px){html,body{overflow:auto}.layout,.layout.hide-left,.layout.hide-right,.layout.hide-left.hide-right{height:auto;display:block}.left,.right{border:0;max-height:520px}.layout.hide-left .left,.layout.hide-right .right{display:none}.center{height:70vh}.right{border-top:1px solid var(--line)}.search-wrap{width:100%;order:3}header{height:auto;flex-wrap:wrap}.graph-legend{display:none}.graph-title span{display:none}}
    .check.subordinate{margin-left:22px}.check.subordinate:has(input:disabled){opacity:.45}.call-group{pointer-events:none}.call-group rect{fill:var(--panel);fill-opacity:.45;stroke:var(--line);stroke-dasharray:5 4}.call-group text{fill:var(--muted);font-size:12px;font-weight:600}.call-group .group-caption{font-size:10px;font-weight:400}
    .callee-call{color:inherit;background:color-mix(in srgb,var(--relation-color) 20%,var(--code));border-bottom:2px solid var(--relation-color);font-weight:600}.callee-call.status-inferred{border-bottom-style:dashed}.callee-call.status-unresolved,.callee-call.status-ambiguous,.callee-call.status-unavailable,.callee-call.status-external{border-bottom-style:dotted}
    .pane-resizer{position:absolute;top:0;bottom:0;width:7px;z-index:5;cursor:col-resize;touch-action:none}.left .pane-resizer{right:0}.right .pane-resizer{left:0}.pane-resizer:hover,.pane-resizer:focus-visible{background:var(--accent);outline:0}.resizing,.resizing *{cursor:col-resize!important;user-select:none!important}.code-line.call-site{background:color-mix(in srgb,var(--inferred) 22%,var(--code));box-shadow:inset 3px 0 var(--inferred)}.code-line.call-site .line-no{color:var(--text);font-weight:bold}
    @media(max-width:820px){.pane-resizer{display:none}}
  </style>
</head>
<body>
  <header><div class="brand-block"><button class="brand" id="homeButton" title="Return to the project overview"><h1>Call Graph Explorer</h1></button><div class="subtitle" id="summary"></div></div><button class="header-control" id="leftPaneToggle" aria-pressed="true">Hide navigator</button><button class="header-control" id="rightPaneToggle" aria-pressed="false">Show details</button><div class="search-wrap"><input id="search" type="search" placeholder="Find a file, class, function, module, or architecture group"><button class="clear-search" id="clearSearch" aria-label="Clear search" title="Clear search" hidden>×</button></div></header>
  <div class="layout" id="layout">
    <aside class="pane left"><div class="pane-resizer" id="leftResizer" role="separator" aria-label="Resize navigator" aria-orientation="vertical" tabindex="0"></div><div class="section tabs" id="perspectives" role="tablist" aria-label="Navigator views"></div><div id="navigator" role="tabpanel"></div><div class="section controls"><label class="check"><input id="orientationToggle" type="checkbox"> Top-down layout</label><label class="check subordinate"><input id="sequenceToggle" type="checkbox" disabled> Grouped call sequence</label><label class="check"><input id="fileNamesToggle" type="checkbox"> Show file names</label><label class="check"><input id="uncertainToggle" type="checkbox"> Show uncertain and external calls</label><label class="check" title="Include test files and libraries copied into this repository, such as doctest."><input id="supportToggle" type="checkbox"> Tests and vendor code</label><label class="check" title="Include unnamed functions and symbols whose names could not be read reliably, often around macros."><input id="noiseToggle" type="checkbox"> Unnamed and unparsed symbols</label></div></aside>
    <main class="center"><div class="graph-toolbar"><button class="icon" id="backButton" hidden aria-label="Back" title="Back">←</button><div class="graph-title"><strong id="graphTitle">Call graph</strong></div><label class="depth-control"><span class="subtitle">Call depth</span><input id="depthSlider" type="range" min="1" max="10" value="1" aria-label="Call depth"><input id="depthInput" type="number" min="1" max="10" value="1" inputmode="numeric" aria-label="Call depth value"></label><button class="icon" id="zoomOut" aria-label="Zoom out" title="Zoom out">−</button><button class="icon" id="zoomIn" aria-label="Zoom in" title="Zoom in">+</button><button id="resetView">Recenter</button><button id="resetLayout" title="Restore default node positions">Reset layout</button></div><div class="canvas-wrap" id="canvasWrap"><svg id="graphCanvas" role="img" aria-label="Interactive caller and callee graph"></svg><div class="graph-hint">Click to explore · drag nodes to arrange · drag background to pan</div><div class="graph-legend"><span class="legend-line"></span>Exact match <span class="legend-line likely"></span>Likely match</div></div></main>
    <aside class="pane right"><div class="pane-resizer" id="rightResizer" role="separator" aria-label="Resize details" aria-orientation="vertical" tabindex="0"></div><div class="right-tabs" id="rightTabs"></div><div class="right-body" id="rightBody"></div></aside>
  </div>
  <script>
    const data=__CODEGRAIDE_GRAPH_DATA__;
    const nodes=new Map(data.nodes.map(n=>[n.id,n]));
    const nameCounts=new Map();for(const node of data.nodes)if(node.path)nameCounts.set(node.name,(nameCounts.get(node.name)||0)+1);
    const displayIdentity=node=>nameCounts.get(node.name)>1&&node.path?node.name+' · '+node.path:node.name;
    const outgoing=new Map(),incoming=new Map();
    for(const r of data.relations){if(!outgoing.has(r.source))outgoing.set(r.source,[]);outgoing.get(r.source).push(r);if(!incoming.has(r.target))incoming.set(r.target,[]);incoming.get(r.target).push(r)}
    const homeSelection=data.initial_selection||data.nodes.find(n=>n.path&&!n.noise)?.id||data.nodes[0]?.id;
    let selected=homeSelection;
    let perspective=data.nodes.some(n=>n.primary_architecture_group)?'architecture':'symbols',activeGroup=null,detailTab='details',graphDepth=1,showUncertain=false,showSupport=false,showNoise=false,history=[],renderedCards=0,selectedOccurrence=0,groupLimit=12,leftOpen=true,rightOpen=false;
    let viewport={x:0,y:0,scale:1},drag=null,noticeTimer=null,suppressNodeClick=false;
    // Offsets survive neighborhood changes without tying nodes to a viewport size.
    const orientationOffsets={horizontal:new Map(),vertical:new Map(),grouped:new Map()};
    let groupedSequence=false;let graphGroups=[],groupedNodeInfo=new Map();
    let topDown=false,nodeOffsets=orientationOffsets.horizontal;
    let graphPositions=new Map(),graphEdges=[];
    const nodeW=220;let nodeH=58,showFileNames=false;
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const statusLabels={exact:'Exact match',inferred:'Likely match',ambiguous:'Several possible matches',external:'Outside this project',unresolved:'No match found',unavailable:'Could not analyze'};
    const perspectives=[['files','Files'],['symbols','Symbols'],['modules','Modules'],['architecture','Architecture']];
    const detailTabs=[['details','Overview'],['source','Code'],['calls','Calls']];
    document.getElementById('summary').textContent=`${data.nodes.filter(n=>n.path).length} symbols · ${data.relations.reduce((sum,r)=>sum+Math.max(r.evidence.length,1),0)} call sites`;
    function isBoundary(n){return !n.path}
    function isSupport(n){return /^(test|tests|third_party|third-party|vendor|external)\//.test(n.path||'')||/(^|\/)doctest[^/]*\.(h|hpp|cc|cpp)$/.test(n.path||'')}
    function readableLabel(value){const text=value||'',opens=(text.match(/</g)||[]).length,closes=(text.match(/>/g)||[]).length;return opens===closes&&!text.includes('<anonymous-')&&!/(^|::)DOCTEST_/.test(text)}
    function isBrowsable(n){return (showNoise||(!n.noise&&readableLabel(n.name)&&readableLabel(ownerName(n))))&&(showSupport||!isSupport(n))&&(showUncertain||!isBoundary(n))}
    function searchText(n){return [n.name,n.path,n.signature,n.module,...n.module_imports,...n.module_exports,...n.architecture_groups].filter(Boolean).join(' ').toLowerCase()}
    function ownerName(n){const parts=n.name.split('::');return parts.length>1?parts.slice(0,-1).join('::'):'Global scope'}
    function groupFor(n){if(perspective==='files')return n.path||'Boundaries';if(perspective==='modules')return n.module||'Not in a named module';if(perspective==='architecture')return n.primary_architecture_group||'Ungrouped';return ownerName(n)}
    function connectionCount(n){return (outgoing.get(n.id)?.length||0)+(incoming.get(n.id)?.length||0)}
    function nodeMeta(n){return [n.kind,n.signature,n.path].filter(Boolean).join(' · ')}
    function choose(id,push=true){if(!nodes.has(id)||id===selected)return;if(push&&selected)history.push(selected);selected=id;selectedOccurrence=0;renderedCards=0;viewport={x:0,y:0,scale:1};renderAll()}
    window.choose=choose;
    function renderTabs(){const p=document.getElementById('perspectives');p.innerHTML='';for(const [id,label] of perspectives){const b=document.createElement('button');b.textContent=label;b.id='perspective-'+id;b.setAttribute('role','tab');b.setAttribute('aria-selected',id===perspective);b.setAttribute('aria-controls','navigator');b.tabIndex=id===perspective?0:-1;b.onclick=()=>{perspective=id;activeGroup=null;groupLimit=12;renderTabs();renderNavigator();document.getElementById('perspective-'+id).focus()};b.onkeydown=e=>{const index=perspectives.findIndex(p=>p[0]===id),next=e.key==='ArrowRight'?(index+1)%perspectives.length:e.key==='ArrowLeft'?(index+perspectives.length-1)%perspectives.length:e.key==='Home'?0:e.key==='End'?perspectives.length-1:null;if(next!==null){e.preventDefault();document.getElementById('perspective-'+perspectives[next][0]).click()}};p.appendChild(b)}document.getElementById('navigator').setAttribute('aria-labelledby','perspective-'+perspective);const r=document.getElementById('rightTabs');r.innerHTML='';for(const [id,label] of detailTabs){const b=document.createElement('button');b.textContent=label;b.setAttribute('aria-pressed',id===detailTab);b.onclick=()=>{detailTab=id;renderTabs();renderSidebar()};r.appendChild(b)}}
    function navButton(n){return `<button class="nav-item${n.id===selected?' selected':''}" onclick="choose('${n.id}')"><strong>${esc(n.short_name||n.name)}</strong><small>${esc(nodeMeta(n))}</small></button>`}
    function renderNavigator(){const box=document.getElementById('navigator'),q=document.getElementById('search').value.trim().toLowerCase();const available=data.nodes.filter(isBrowsable);if(q){const matches=available.filter(n=>searchText(n).includes(q)).sort((a,b)=>connectionCount(b)-connectionCount(a)||a.name.localeCompare(b.name));box.innerHTML=`<div class="nav-heading"><strong>Search results</strong><span class="count">${matches.length}${matches.length>30?' · first 30 shown':''}</span></div>${matches.slice(0,30).map(navButton).join('')||'<div class="empty">No matching code found.</div>'}`;return}if(activeGroup){const matches=available.filter(n=>groupFor(n)===activeGroup).sort((a,b)=>connectionCount(b)-connectionCount(a)||a.name.localeCompare(b.name));box.innerHTML=`<div class="nav-heading"><button class="back" id="groupBack">← Groups</button><span class="count">${matches.length}${matches.length>30?' · first 30 shown':''}</span></div><div class="nav-heading"><strong>${esc(activeGroup)}</strong></div>${matches.slice(0,30).map(navButton).join('')}${matches.length>30?'<div class="notice">Use search to narrow this group.</div>':''}`;document.getElementById('groupBack').onclick=()=>{activeGroup=null;renderNavigator()};return}const groups=new Map();for(const n of available.filter(n=>n.path)){const g=groupFor(n);groups.set(g,(groups.get(g)||0)+1)}const ordered=[...groups].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));box.innerHTML=`<div class="nav-heading"><strong>${perspectives.find(p=>p[0]===perspective)[1]} groups</strong><span class="count">${ordered.length}</span></div>${ordered.slice(0,groupLimit).map(([g,count])=>`<button class="nav-item group-item" data-group="${esc(g)}"><strong>${esc(g)}</strong><small>${count} symbol${count===1?'':'s'}</small></button>`).join('')||'<div class="empty">No groups in this view.</div>'}${ordered.length>groupLimit?`<button class="show-more" id="moreGroups">Show ${ordered.length-groupLimit} more groups…</button>`:''}`;for(const b of box.querySelectorAll('.group-item'))b.onclick=()=>{activeGroup=b.dataset.group;renderNavigator()};const more=document.getElementById('moreGroups');if(more)more.onclick=()=>{groupLimit=ordered.length;renderNavigator()}}
    function relationAllowed(r){return ['exact','inferred'].includes(r.status)||showUncertain}

      const remaining=allowed.filter(r=>!shown(r)).sort((a,b)=>nodes.get(other(a)).name.localeCompare(nodes.get(other(b)).name));
      return {inGraph,remaining}
    }
    function relationSections(groups,render,empty){
      const shown=groups.inGraph.map(render).join(''),more=groups.remaining.length;
      return (shown||`<div class="empty">${empty}</div>`)+(more?`<details class="other-calls"><summary>${more} more · not shown in graph</summary>${groups.remaining.map(render).join('')}</details>`:'')
    }
    function renderDetails(n){const out=sidebarRelations(n,'out'),inc=sidebarRelations(n,'in'),tags=[plainKind(n.kind),plainLink(n.link_status),n.module&&`Module ${n.module}`,...n.architecture_groups].filter(Boolean);const module=n.module?`<div class="section"><h3>Module ${esc(n.module)}</h3><div class="signature"><strong>Uses</strong><br>${n.module_imports.map(esc).join('<br>')||'No module imports found'}<br><br><strong>Makes available</strong><br>${n.module_exports.map(esc).join('<br>')||'No exports found'}</div></div>`:'';const links=(groups,direction,empty)=>relationSections(groups,r=>{const x=nodes.get(direction==='out'?r.target:r.source);return `<button class="relation-link status-${esc(r.status)}" title="${esc(statusLabels[r.status]||r.status)}" aria-label="${esc(x.name)}: ${esc(statusLabels[r.status]||r.status)}" onclick="choose('${x.id}')">${esc(x.name)}</button>`},empty);return `<div class="section symbol-header"><h2>${esc(n.name)}</h2><div class="symbol-meta">${tags.map(esc).join(' · ')}</div>${n.signature?`<div class="signature"><code>${esc(n.signature)}</code></div>`:''}<div class="location">${esc(n.path||'No local file')}</div></div><div class="section"><h3>Statistics</h3><dl class="stats"><dt>Exact callers</dt><dd>${n.fan_in}</dd><dt>Exact calls made</dt><dd>${n.fan_out}</dd><dt>Source lines</dt><dd>${n.source?.lines?.length??'—'}</dd></dl><div class="notice">Call counts exclude likely matches.</div></div>${module}<div class="section"><h3>Called by</h3>${links(inc,'in','No callers in this graph.')}</div><div class="section"><h3>Calls from here</h3>${links(out,'out','No calls from this symbol in the graph.')}</div>`}
    function renderSource(n){const occurrences=n.occurrences||[],source=occurrences.length?occurrences[selectedOccurrence]?.source:n.source,occurrenceLabel=o=>o.kind==='definition'?'Definition':'Declaration';return `<div class="section"><h2>${esc(n.short_name||n.name)}</h2><div class="location">${esc(n.path||'No local source')}</div></div><div class="section"><h3>Where this symbol appears</h3><div class="source-tools">${occurrences.map((o,i)=>`<button aria-pressed="${i===selectedOccurrence}" onclick="showOccurrence(${i})">${occurrenceLabel(o)} ${esc(o.label)}</button>`).join('')||'<span class="empty">No source was embedded for this symbol.</span>'}</div>${sourceHtml(source,[],n.id,occurrences.length?occurrences[selectedOccurrence]?.label.replace(/:\d+:\d+$/,''):n.path)}</div>`}
    window.toggleProjection=(button,targetId,depth,ancestryText,relationIndex)=>{const host=button.closest('.evidence'),old=host.querySelector(':scope > .projection');if(old){old.remove();button.textContent='Code';renderedCards=Math.max(0,renderedCards-1);return}const ancestry=ancestryText?ancestryText.split('|'):[];if(renderedCards>=100){host.insertAdjacentHTML('beforeend','<div class="projection notice">Too many code previews are open. Close one before opening another.</div>');return}if(depth>=data.max_expansion_depth){host.insertAdjacentHTML('beforeend',`<div class="projection notice">This preview stops after ${data.max_expansion_depth} nested calls.</div>`);return}if(ancestry.includes(targetId)){host.insertAdjacentHTML('beforeend','<div class="projection notice">This call leads back to a function already shown above.</div>');return}const target=nodes.get(targetId),relation=data.relations[relationIndex],evidence=relation?.evidence[0],caller=nodes.get(relation?.source);
      const callerSource=evidence&&((caller?.occurrences||[]).find(o=>o.label.startsWith(evidence.path+':')&&o.source.start_line<=evidence.line&&o.source.end_line>=evidence.line)?.source||(caller?.path===evidence.path?caller.source:null));
      const hasCallSite=callerSource&&evidence&&callerSource.start_line<=evidence.line&&callerSource.end_line>=evidence.line;
      const highlights=hasCallSite?[evidence.line]:[];
      let callSite='';
      if(evidence&&relation.source!==targetId){
        const first=hasCallSite?Math.max(callerSource.start_line,evidence.line-2):0,last=hasCallSite?Math.min(callerSource.end_line,evidence.line+2):0;
        const context=hasCallSite?{start_line:first,start_column:first===callerSource.start_line?callerSource.start_column:1,end_line:last,lines:callerSource.lines.slice(first-callerSource.start_line,last-callerSource.start_line+1)}:null;
        callSite=`<strong>Call site · ${esc(evidence.path)}:${evidence.line}</strong>${context?sourceHtml(context,highlights,caller.id,evidence.path):'<div class="notice">Caller source is not embedded for this location.</div>'}`
      }
      renderedCards++;button.textContent='Hide code';host.insertAdjacentHTML('beforeend',`<div class="projection">${callSite}<strong>Function code · ${esc(target.name)}</strong>${sourceHtml(target.source,relation?.source===targetId?highlights:[],targetId,target.path)}</div>`)};
    function callCard(r,target,n){const ev=r.evidence[0]||{},expand=target?.source&&['exact','inferred'].includes(r.status)?`<button onclick="toggleProjection(this,'${target.id}',0,'${n.id}',${data.relations.indexOf(r)})">Code</button>`:'',reason=humanReason(r.reason);return `<div class="evidence"><button class="relation-link status-${esc(r.status)}" title="${esc(statusLabels[r.status]||r.status)}" aria-label="${esc(target.name)}: ${esc(statusLabels[r.status]||r.status)}" onclick="choose('${target.id}')"><strong>${esc(target.name)}</strong></button><div class="call-expression">${esc(ev.expression||'Call expression unavailable')}</div><div class="location">${plainForm(ev.form)} · ${esc(ev.path||'Unknown file')}:${ev.line||'?'}:${ev.column||'?'}</div>${reason?`<div class="notice">${esc(reason)}</div>`:''}${r.alternatives.length?`<div class="notice"><strong>Other possible matches:</strong><br>${r.alternatives.map(a=>esc(a.name)+(a.signature?' · '+esc(a.signature):'')).join('<br>')}</div>`:''}${expand}</div>`}
    function renderCalls(n){const out=sidebarRelations(n,'out'),inc=sidebarRelations(n,'in'),cards=(groups,direction,empty)=>relationSections(groups,r=>callCard(r,nodes.get(direction==='out'?r.target:r.source),n),empty);return `<div class="section"><h2>Calls</h2>${n.link_status==='ambiguous'?'<div class="notice">Multiple definitions share this symbol. Calls below may come from different files.</div>':''}</div><div class="section"><h3>Calls made here · in graph</h3>${cards(out,'out','No outgoing calls in this graph.')}</div><div class="section"><h3>Called from · in graph</h3>${cards(inc,'in','No callers in this graph.')}</div>`}
    function renderSidebar(){const n=nodes.get(selected);if(!n){document.getElementById('rightBody').innerHTML='<div class="empty">Select a graph node.</div>';return}document.getElementById('rightBody').innerHTML=detailTab==='source'?renderSource(n):detailTab==='calls'?renderCalls(n):renderDetails(n)}
    function renderDepth(){document.getElementById('depthSlider').value=graphDepth;document.getElementById('depthInput').value=graphDepth}
    function setGraphDepth(value){const parsed=Number.parseInt(value,10);graphDepth=Math.max(1,Math.min(10,Number.isFinite(parsed)?parsed:1));viewport={x:0,y:0,scale:1};renderDepth();renderGraph();if(topDown)recenterGraph()}
    function renderSearchState(){const search=document.getElementById('search');document.getElementById('clearSearch').hidden=!search.value}
    function setSearch(value){document.getElementById('search').value=value;renderSearchState();renderNavigator()}
    function renderPaneState(){const layout=document.getElementById('layout'),left=document.getElementById('leftPaneToggle'),right=document.getElementById('rightPaneToggle');layout.classList.toggle('hide-left',!leftOpen);layout.classList.toggle('hide-right',!rightOpen);left.setAttribute('aria-pressed',leftOpen);right.setAttribute('aria-pressed',rightOpen);left.textContent=leftOpen?'Hide navigator':'Show navigator';right.textContent=rightOpen?'Hide details':'Show details';requestAnimationFrame(renderGraph)}
    function goHome(){setSearch('');selected=homeSelection;perspective=data.nodes.some(n=>n.primary_architecture_group)?'architecture':'symbols';activeGroup=null;detailTab='details';graphDepth=1;groupLimit=12;history=[];selectedOccurrence=0;viewport={x:0,y:0,scale:1};leftOpen=true;rightOpen=false;renderAll()}
    function renderAll(){renderTabs();renderDepth();renderSearchState();renderNavigator();renderGraph();renderSidebar();renderPaneState();document.getElementById('backButton').hidden=!history.length}
    document.getElementById('homeButton').onclick=goHome;document.getElementById('search').addEventListener('input',e=>setSearch(e.target.value));document.getElementById('clearSearch').onclick=()=>{setSearch('');document.getElementById('search').focus()};document.getElementById('depthSlider').addEventListener('input',e=>setGraphDepth(e.target.value));document.getElementById('depthInput').addEventListener('change',e=>setGraphDepth(e.target.value));document.getElementById('depthInput').addEventListener('keydown',e=>{if(e.key==='Enter')setGraphDepth(e.target.value)});document.getElementById('uncertainToggle').onchange=e=>{showUncertain=e.target.checked;renderAll()};document.getElementById('supportToggle').onchange=e=>{showSupport=e.target.checked;renderAll()};document.getElementById('noiseToggle').onchange=e=>{showNoise=e.target.checked;renderAll()};document.getElementById('leftPaneToggle').onclick=()=>{leftOpen=!leftOpen;renderPaneState()};document.getElementById('rightPaneToggle').onclick=()=>{rightOpen=!rightOpen;renderPaneState()};document.getElementById('backButton').onclick=()=>{const id=history.pop();if(id){selected=id;selectedOccurrence=0;viewport={x:0,y:0,scale:1};renderAll()}};document.getElementById('zoomIn').onclick=()=>zoomViewport(viewport.scale*1.2);document.getElementById('zoomOut').onclick=()=>zoomViewport(viewport.scale/1.2);document.getElementById('resetView').onclick=recenterGraph;document.getElementById('resetLayout').onclick=()=>{nodeOffsets.clear();viewport={x:0,y:0,scale:1};renderGraph(false);recenterGraph()};
    const paneWidths={left:260,right:360};
    function resizePane(side,width){
      const layout=document.getElementById('layout'),other=side==='left'?(rightOpen?paneWidths.right:0):(leftOpen?paneWidths.left:0),minimum=side==='left'?200:240,maximum=Math.max(minimum,layout.clientWidth-other-360);
      paneWidths[side]=Math.max(minimum,Math.min(maximum,width));
      layout.style.setProperty('--'+side+'-width',paneWidths[side]+'px');
      const handle=document.getElementById(side+'Resizer');
      handle.setAttribute('aria-valuemin',minimum);handle.setAttribute('aria-valuemax',maximum);handle.setAttribute('aria-valuenow',paneWidths[side]);
      // Resizing must not close code previews already open in the sidebar.
      renderGraph(false)
    }
    for(const side of ['left','right']){
      const handle=document.getElementById(side+'Resizer');let resizing=null;
      handle.setAttribute('aria-valuenow',paneWidths[side]);
      handle.addEventListener('pointerdown',event=>{if(event.button!==0)return;resizing={x:event.clientX,width:paneWidths[side],pointerId:event.pointerId};handle.setPointerCapture(event.pointerId);document.body.classList.add('resizing');event.preventDefault()});
      handle.addEventListener('pointermove',event=>{if(!resizing||event.pointerId!==resizing.pointerId)return;resizePane(side,resizing.width+(event.clientX-resizing.x)*(side==='left'?1:-1))});
      const finish=event=>{if(!resizing||event.pointerId!==resizing.pointerId)return;resizing=null;document.body.classList.remove('resizing');if(handle.hasPointerCapture(event.pointerId))handle.releasePointerCapture(event.pointerId)};
      handle.addEventListener('pointerup',finish);handle.addEventListener('pointercancel',finish);handle.addEventListener('lostpointercapture',finish);
      handle.addEventListener('keydown',event=>{if(!['ArrowLeft','ArrowRight','Home'].includes(event.key))return;event.preventDefault();resizePane(side,event.key==='Home'?(side==='left'?260:360):paneWidths[side]+(event.key==='ArrowRight'?24:-24)*(side==='left'?1:-1))})
    }
    document.getElementById('sequenceToggle').onchange=event=>{groupedSequence=event.target.checked;setOrientation(topDown)};
    document.getElementById('orientationToggle').onchange=event=>setOrientation(event.target.checked);
    document.getElementById('fileNamesToggle').onchange=event=>{showFileNames=event.target.checked;renderGraph(false)};
    function wheelZoomDelta(e){return Math.abs(e.deltaY)>=Math.abs(e.deltaX)?e.deltaY:e.deltaX}
    const svg=document.getElementById('graphCanvas');svg.addEventListener('wheel',e=>{const delta=wheelZoomDelta(e);if(!delta)return;e.preventDefault();zoomViewport(viewport.scale*(delta<0?1.1:.9),e.clientX,e.clientY)},{passive:false});svg.addEventListener('pointerdown',e=>{
      if(e.button!==0||drag)return;
      suppressNodeClick=false;
      const id=e.target.closest('.graph-node')?.dataset.id,position=graphPositions.get(id),offset=nodeOffsets.get(id)||{x:0,y:0};
      drag={pointerId:e.pointerId,id,x:e.clientX,y:e.clientY,ox:viewport.x,oy:viewport.y,position:position&&{...position},offset:{...offset},moved:false};
      svg.setPointerCapture(e.pointerId)
    });
    svg.addEventListener('pointermove',e=>{
      if(!drag||e.pointerId!==drag.pointerId)return;
      const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
      if(!drag.moved&&Math.hypot(dx,dy)<4)return;
      drag.moved=true;
      const rect=svg.getBoundingClientRect(),view=svg.viewBox.baseVal,sx=view.width/rect.width,sy=view.height/rect.height;
      if(drag.id){const x=dx*sx/viewport.scale,y=dy*sy/viewport.scale;nodeOffsets.set(drag.id,{x:drag.offset.x+x,y:drag.offset.y+y});graphPositions.set(drag.id,{x:drag.position.x+x,y:drag.position.y+y});updateDraggedNode(drag.id)}
      else{viewport.x=drag.ox+dx*sx;viewport.y=drag.oy+dy*sy;applyViewport()}
    });
    function finishDrag(e){
      if(!drag||e.pointerId!==drag.pointerId)return;
      const completed=drag;drag=null;suppressNodeClick=completed.moved;
      if(svg.hasPointerCapture(e.pointerId))svg.releasePointerCapture(e.pointerId);
      // Capture targets the SVG, so activate a stationary node explicitly.
      if(e.type==='pointerup'&&!completed.moved&&completed.id)choose(completed.id)
    }
    svg.addEventListener('pointerup',finishDrag);svg.addEventListener('pointercancel',finishDrag);svg.addEventListener('lostpointercapture',finishDrag);
    window.addEventListener('resize',renderGraph);
    renderAll();
  </script>
