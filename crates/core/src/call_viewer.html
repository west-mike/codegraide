    .layout{height:calc(100% - 58px);display:grid;grid-template-columns:260px minmax(520px,1fr) 360px}.layout.hide-left{grid-template-columns:0 minmax(520px,1fr) 360px}.layout.hide-right{grid-template-columns:260px minmax(520px,1fr) 0}.layout.hide-left.hide-right{grid-template-columns:0 minmax(520px,1fr) 0}.pane{min-width:0;background:var(--panel)}.left{grid-column:1;border-right:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column}.center{grid-column:2}.right{grid-column:3;border-left:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column}.layout.hide-left .left,.layout.hide-right .right{display:none}.section{padding:12px;border-bottom:1px solid var(--line)}.tabs{display:flex;gap:5px;flex-wrap:wrap}.tabs button{font-size:12px;padding:5px 7px}.controls{display:grid;gap:8px}.check{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
    .nav-search{padding:9px;border-bottom:1px solid var(--line)}.nav-search input{width:100%;height:34px;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--panel2)}#navigator{overflow:auto;padding:8px 9px 18px}.nav-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 3px 5px}.nav-heading strong{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}.nav-item{display:block;width:100%;border:0;background:transparent;text-align:left;padding:7px 8px;margin:1px 0;overflow-wrap:anywhere}.nav-item:hover,.nav-item.selected{background:var(--accent2)}.nav-item small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.count{font-size:11px;color:var(--muted)}.notice,.empty{padding:10px;color:var(--muted);font-size:12px}.back,.show-more{border:0;background:transparent;color:var(--accent);padding:5px}.show-more{display:block;width:100%;margin-top:5px;text-align:left}
    .center{min-width:0;display:flex;flex-direction:column;overflow:hidden}.graph-toolbar{height:60px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:8px 10px}.graph-toolbar button{height:34px;white-space:nowrap}.graph-title{min-width:120px;margin-left:4px;margin-right:auto}.graph-title strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.graph-title span{color:var(--muted);font-size:11px}.depth-control{display:flex;align-items:center;gap:6px;white-space:nowrap}.depth-control input[type="range"]{width:92px;accent-color:var(--accent)}.depth-control input[type="number"]{width:48px;height:34px;padding:5px 4px 5px 7px;border:1px solid var(--line);border-radius:7px;background:var(--panel2)}.icon{width:34px;padding:5px}.canvas-wrap{position:relative;flex:1;min-height:0;background:radial-gradient(circle at 1px 1px,var(--line) 1px,transparent 1.2px);background-size:22px 22px;overflow:hidden}#graphCanvas{width:100%;height:100%;display:block;touch-action:none}.graph-hint,.graph-legend{position:absolute;padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:color-mix(in srgb,var(--panel) 91%,transparent);color:var(--muted);font-size:11px;pointer-events:none}.graph-hint{left:12px;bottom:10px}.graph-legend{right:12px;bottom:10px}.legend-line{display:inline-block;width:18px;margin:0 5px 2px 9px;border-top:3px solid var(--exact)}.legend-line:first-child{margin-left:0}.legend-line.likely{border-color:var(--inferred)}.graph-node{cursor:pointer;user-select:none}.graph-node rect{fill:var(--panel);stroke:var(--line);stroke-width:1.4;filter:drop-shadow(0 4px 8px #10204018)}.graph-node.selected rect{stroke:var(--accent);stroke-width:3;fill:var(--accent2)}.graph-node.boundary rect{stroke:var(--uncertain);stroke-dasharray:5 3}.graph-node.noise rect{stroke:var(--contain);stroke-dasharray:2 3}.node-title{fill:var(--text);font-size:12px;font-weight:650}.node-meta{fill:var(--muted);font-size:10px}.layer-label{fill:var(--muted);font-size:11px;font-weight:700;text-anchor:middle;text-transform:uppercase;letter-spacing:.04em}.edge{fill:none;stroke:var(--exact);stroke-width:2.2;opacity:.9}.edge.inferred{stroke:var(--inferred)}.edge.uncertain{stroke:var(--uncertain)}.edge.contains{stroke:var(--contain)}.truncated{position:absolute;top:38px;left:50%;transform:translateX(-50%);padding:7px 10px;background:var(--panel);border:1px solid var(--line);border-radius:7px;color:var(--muted);font-size:11px;box-shadow:var(--shadow);pointer-events:none}
    .right-tabs{padding:9px;border-bottom:1px solid var(--line);display:flex;gap:5px}.right-body{overflow:auto;flex:1}.right h2{font-size:16px;margin:0;overflow-wrap:anywhere}.right h3{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 8px}.badge{display:inline-flex;margin:2px 3px 2px 0;padding:2px 7px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:10px}.status-exact{color:var(--exact)}.status-inferred{color:var(--inferred)}.status-ambiguous,.status-unresolved,.status-unavailable,.status-external{color:var(--uncertain)}.signature,.location{font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);overflow-wrap:anywhere}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.stat{padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}.stat strong{display:block;font-size:16px}.stat span{font-size:10px;color:var(--muted)}.links{display:grid;gap:3px}.link{border:0;background:transparent;text-align:left;padding:5px 4px;overflow-wrap:anywhere}.link:hover{background:var(--accent2)}.evidence{padding:8px 0;border-bottom:1px solid var(--line);font-size:12px}.evidence:last-child{border:0}.call-expression{font:11px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere}.projection{margin:7px 0 3px 12px;border-left:3px solid var(--accent);padding:8px;background:var(--panel2)}

    @media(max-width:1100px){.layout{grid-template-columns:240px minmax(460px,1fr) 320px}.layout.hide-left{grid-template-columns:0 minmax(460px,1fr) 320px}.layout.hide-right{grid-template-columns:240px minmax(460px,1fr) 0}.header-control{font-size:12px;padding-inline:7px}}@media(max-width:820px){html,body{overflow:auto}.layout,.layout.hide-left,.layout.hide-right,.layout.hide-left.hide-right{height:auto;display:block}.left,.right{border:0;max-height:520px}.layout.hide-left .left,.layout.hide-right .right{display:none}.center{height:70vh}.right{border-top:1px solid var(--line)}.search-wrap{width:100%;order:3}header{height:auto;flex-wrap:wrap}.graph-legend{display:none}.graph-title span{display:none}}

</head>
<body>
  <header><div class="brand-block"><button class="brand" id="homeButton" title="Return to the project overview"><h1>Codegraide Call Graph Explorer</h1></button><div class="subtitle" id="summary"></div></div><button class="header-control" id="leftPaneToggle" aria-pressed="true">Hide navigator</button><button class="header-control" id="rightPaneToggle" aria-pressed="false">Show details</button><div class="search-wrap"><input id="search" type="search" placeholder="Find a file, class, function, module, or architecture group"><button class="clear-search" id="clearSearch" aria-label="Clear search" title="Clear search" hidden>×</button></div></header>
  <div class="layout" id="layout">
    <aside class="pane left"><div class="section tabs" id="perspectives"></div><div class="nav-search"><input id="navigatorSearch" type="search" aria-label="Search navigator" placeholder="Search files and symbols"></div><div class="section controls"><label class="check"><input id="uncertainToggle" type="checkbox"> Show uncertain and external calls</label><label class="check"><input id="supportToggle" type="checkbox"> Show tests and bundled support code</label><label class="check"><input id="noiseToggle" type="checkbox"> Show parser-level and synthetic details</label></div><div id="navigator"></div></aside>
    <main class="center"><div class="graph-toolbar"><button id="backButton" title="Return to the previously selected function">← Previous</button><div class="graph-title"><strong id="graphTitle">Call graph</strong><span id="graphSubtitle">Who calls this, and what it calls</span></div><label class="depth-control"><span class="subtitle">Call depth</span><input id="depthSlider" type="range" min="1" max="10" value="1" aria-label="Call depth"><input id="depthInput" type="number" min="1" max="10" value="1" inputmode="numeric" aria-label="Call depth value"></label><button class="icon" id="zoomOut" aria-label="Zoom out" title="Zoom out">−</button><button class="icon" id="zoomIn" aria-label="Zoom in" title="Zoom in">+</button><button id="resetView">Recenter</button></div><div class="canvas-wrap" id="canvasWrap"><svg id="graphCanvas" role="img" aria-label="Interactive caller and callee graph"></svg><div class="graph-hint">Click a function to explore it · drag the background to move</div><div class="graph-legend"><span class="legend-line"></span>Exact match <span class="legend-line likely"></span>Likely match</div></div></main>
    <aside class="pane right"><div class="right-tabs" id="rightTabs"></div><div class="right-body" id="rightBody"></div></aside>
  </div>
  <script>
    const data=__CODEGRAIDE_GRAPH_DATA__;
    const nodes=new Map(data.nodes.map(n=>[n.id,n]));
    const outgoing=new Map(),incoming=new Map();
    for(const r of data.relations){if(!outgoing.has(r.source))outgoing.set(r.source,[]);outgoing.get(r.source).push(r);if(!incoming.has(r.target))incoming.set(r.target,[]);incoming.get(r.target).push(r)}
    const homeSelection=data.initial_selection||data.nodes.find(n=>n.path&&!n.noise)?.id||data.nodes[0]?.id;
    let selected=homeSelection;
    let perspective=data.nodes.some(n=>n.primary_architecture_group)?'architecture':'symbols',activeGroup=null,detailTab='details',graphDepth=1,showUncertain=false,showSupport=false,showNoise=false,history=[],renderedCards=0,selectedOccurrence=0,groupLimit=12,leftOpen=true,rightOpen=false;
    let viewport={x:0,y:0,scale:1},drag=null,noticeTimer=null;
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const statusLabels={exact:'Exact match',inferred:'Likely match',ambiguous:'Several possible matches',external:'Outside this project',unresolved:'No match found',unavailable:'Could not analyze'};
    const status=s=>`<span class="badge status-${esc(s)}">${esc(statusLabels[s]||s)}</span>`;
    const perspectives=[['files','Files'],['symbols','Symbols'],['modules','Modules'],['architecture','Architecture']];
    const detailTabs=[['details','Overview'],['source','Code'],['calls','Calls']];
    document.getElementById('summary').textContent=`${data.nodes.filter(n=>n.path).length} symbols · ${data.relations.reduce((sum,r)=>sum+Math.max(r.evidence.length,1),0)} call sites`;
    function isBoundary(n){return !n.path}
    function isSupport(n){return /^(test|tests|third_party|third-party|vendor|external)\//.test(n.path||'')||/(^|\/)doctest[^/]*\.(h|hpp|cc|cpp)$/.test(n.path||'')}
    function readableLabel(value){const text=value||'',opens=(text.match(/</g)||[]).length,closes=(text.match(/>/g)||[]).length;return opens===closes&&!text.includes('<anonymous-')&&!/(^|::)DOCTEST_/.test(text)}
    function isBrowsable(n){return (showNoise||(!n.noise&&readableLabel(n.name)&&readableLabel(ownerName(n))))&&(showSupport||!isSupport(n))&&(showUncertain||!isBoundary(n))}
    function searchText(n){return [n.name,n.path,n.signature,n.module,...n.module_imports,...n.module_exports,...n.architecture_groups].filter(Boolean).join(' ').toLowerCase()}
    function ownerName(n){const parts=n.name.split('::');return parts.length>1?parts.slice(0,-1).join('::'):'Global scope'}
    function groupFor(n){if(perspective==='files')return n.path||'Boundaries';if(perspective==='modules')return n.module||'Not in a named module';if(perspective==='architecture')return n.primary_architecture_group||'Ungrouped';return ownerName(n)}
    function connectionCount(n){return (outgoing.get(n.id)?.length||0)+(incoming.get(n.id)?.length||0)}
    function nodeMeta(n){return [n.kind,n.signature,n.path].filter(Boolean).join(' · ')}
    function choose(id,push=true){if(!nodes.has(id)||id===selected)return;if(push&&selected)history.push(selected);selected=id;selectedOccurrence=0;renderedCards=0;viewport={x:0,y:0,scale:1};renderAll()}
    window.choose=choose;
    function renderTabs(){const p=document.getElementById('perspectives');p.innerHTML='';for(const [id,label] of perspectives){const b=document.createElement('button');b.textContent=label;b.setAttribute('aria-pressed',id===perspective);b.onclick=()=>{perspective=id;activeGroup=null;groupLimit=12;renderNavigator()};p.appendChild(b)}const r=document.getElementById('rightTabs');r.innerHTML='';for(const [id,label] of detailTabs){const b=document.createElement('button');b.textContent=label;b.setAttribute('aria-pressed',id===detailTab);b.onclick=()=>{detailTab=id;renderTabs();renderSidebar()};r.appendChild(b)}}
    function navButton(n){return `<button class="nav-item${n.id===selected?' selected':''}" onclick="choose('${n.id}')"><strong>${esc(n.short_name||n.name)}</strong><small>${esc(nodeMeta(n))}</small></button>`}
    function renderNavigator(){const box=document.getElementById('navigator'),q=document.getElementById('search').value.trim().toLowerCase();const available=data.nodes.filter(isBrowsable);if(q){const matches=available.filter(n=>searchText(n).includes(q)).sort((a,b)=>connectionCount(b)-connectionCount(a)||a.name.localeCompare(b.name));box.innerHTML=`<div class="nav-heading"><strong>Search results</strong><span class="count">${matches.length}${matches.length>30?' · first 30 shown':''}</span></div>${matches.slice(0,30).map(navButton).join('')||'<div class="empty">No matching code found.</div>'}`;return}if(activeGroup){const matches=available.filter(n=>groupFor(n)===activeGroup).sort((a,b)=>connectionCount(b)-connectionCount(a)||a.name.localeCompare(b.name));box.innerHTML=`<div class="nav-heading"><button class="back" id="groupBack">← Groups</button><span class="count">${matches.length}${matches.length>30?' · first 30 shown':''}</span></div><div class="nav-heading"><strong>${esc(activeGroup)}</strong></div>${matches.slice(0,30).map(navButton).join('')}${matches.length>30?'<div class="notice">Use search to narrow this group.</div>':''}`;document.getElementById('groupBack').onclick=()=>{activeGroup=null;renderNavigator()};return}const groups=new Map();for(const n of available.filter(n=>n.path)){const g=groupFor(n);groups.set(g,(groups.get(g)||0)+1)}const ordered=[...groups].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));box.innerHTML=`<div class="nav-heading"><strong>${perspectives.find(p=>p[0]===perspective)[1]} groups</strong><span class="count">${ordered.length}</span></div><div class="notice">Choose a group, or search here.</div>${ordered.slice(0,groupLimit).map(([g,count])=>`<button class="nav-item group-item" data-group="${esc(g)}"><strong>${esc(g)}</strong><small>${count} symbol${count===1?'':'s'}</small></button>`).join('')||'<div class="empty">No groups in this view.</div>'}${ordered.length>groupLimit?`<button class="show-more" id="moreGroups">Show ${ordered.length-groupLimit} more groups…</button>`:''}`;for(const b of box.querySelectorAll('.group-item'))b.onclick=()=>{activeGroup=b.dataset.group;renderNavigator()};const more=document.getElementById('moreGroups');if(more)more.onclick=()=>{groupLimit=ordered.length;renderNavigator()}}
    function relationAllowed(r){return ['exact','inferred'].includes(r.status)||showUncertain}
    function graphNodeAllowed(n){return n&&(isBrowsable(n)||n.id===selected)}
    function directChildren(n){if(!['class','struct','namespace'].includes(n.kind))return[];const prefix=n.name+'::';return data.nodes.filter(c=>c.path&&c.name.startsWith(prefix)&&!c.name.slice(prefix.length).includes('::')&&graphNodeAllowed(c)).sort((a,b)=>connectionCount(b)-connectionCount(a)||a.name.localeCompare(b.name))}
    function graphNeighborhood(){const layer=new Map([[selected,0]]),edges=[],edgeKeys=new Set(),current=nodes.get(selected),height=Math.max(document.getElementById('canvasWrap').clientHeight,420),perLayer=Math.max(3,Math.min(7,Math.floor((height-90)/78)));let omitted=0;const addEdge=(source,target,status,label)=>{const key=[source,target,status].join('|');if(!edgeKeys.has(key)){edgeKeys.add(key);edges.push({source,target,status,label})}};if(['class','struct','namespace'].includes(current.kind)){const children=directChildren(current),shown=children.slice(0,perLayer);for(const child of shown){layer.set(child.id,1);addEdge(current.id,child.id,'contains','contains')}omitted=children.length-shown.length;return{layer,edges,omitted,perLayer}}let frontier=[selected];for(let step=0;step<graphDepth&&frontier.length;step++){const candidates=new Map(),possible=[];const consider=(r,id,value)=>{const n=nodes.get(id);if(!relationAllowed(r)||!graphNodeAllowed(n))return;possible.push(r);if(layer.has(id))return;const prior=candidates.get(id),entry={id,layer:value,status:r.status};if(!prior||entry.status==='exact'&&prior.status!=='exact')candidates.set(id,entry)};for(const id of frontier){const value=layer.get(id)||0;if(value>=0)for(const r of outgoing.get(id)||[])consider(r,r.target,value+1);if(value<=0)for(const r of incoming.get(id)||[])consider(r,r.source,value-1)}const byLayer=new Map();for(const entry of candidates.values()){if(!byLayer.has(entry.layer))byLayer.set(entry.layer,[]);byLayer.get(entry.layer).push(entry)}const next=[];for(const [value,entries] of [...byLayer].sort((a,b)=>a[0]-b[0])){entries.sort((a,b)=>(a.status==='exact'?0:1)-(b.status==='exact'?0:1)||connectionCount(nodes.get(b.id))-connectionCount(nodes.get(a.id))||nodes.get(a.id).name.localeCompare(nodes.get(b.id).name));const shown=entries.slice(0,perLayer);omitted+=entries.length-shown.length;for(const entry of shown){layer.set(entry.id,value);next.push(entry.id)}}for(const r of possible)if(layer.has(r.source)&&layer.has(r.target))addEdge(r.source,r.target,r.status,r.status);frontier=next}for(const r of data.relations)if(relationAllowed(r)&&layer.has(r.source)&&layer.has(r.target))addEdge(r.source,r.target,r.status,r.status);return{layer,edges,omitted,perLayer}}
    function short(value,max=29){const text=String(value);return text.length>max?text.slice(0,max-1)+'…':text}
    function applyViewport(){const g=document.getElementById('viewport');if(g)g.setAttribute('transform',`translate(${viewport.x} ${viewport.y}) scale(${viewport.scale})`)}
    function zoomViewport(nextScale,clientX,clientY){const svg=document.getElementById('graphCanvas'),rect=svg.getBoundingClientRect(),view=svg.viewBox.baseVal,scale=Math.max(.35,Math.min(2.5,nextScale));if(scale===viewport.scale||!rect.width||!rect.height)return;const anchorX=Number.isFinite(clientX)?(clientX-rect.left)*view.width/rect.width:view.width/2,anchorY=Number.isFinite(clientY)?(clientY-rect.top)*view.height/rect.height:view.height/2,ratio=scale/viewport.scale;viewport.x=anchorX-(anchorX-viewport.x)*ratio;viewport.y=anchorY-(anchorY-viewport.y)*ratio;viewport.scale=scale;applyViewport()}
    function showGraphNotice(wrap,message){clearTimeout(noticeTimer);wrap.querySelector('.truncated')?.remove();if(!message)return;wrap.insertAdjacentHTML('beforeend',`<div class="truncated" role="status">${esc(message)}</div>`);noticeTimer=setTimeout(()=>wrap.querySelector('.truncated')?.remove(),3500)}
    function renderGraph(){
      const svg=document.getElementById('graphCanvas'),wrap=document.getElementById('canvasWrap'),current=nodes.get(selected);
      if(!current){svg.innerHTML='';return}
      const container=['class','struct','namespace'].includes(current.kind),owner=ownerName(current);
      document.getElementById('graphTitle').textContent=current.name;
      document.getElementById('graphSubtitle').textContent=container?`Choose a ${current.kind==='namespace'?'symbol':'method'} to explore its calls`:owner==='Global scope'?'Who calls this, and what it calls':`Who calls this, and what it calls · ${owner}`;
      const width=Math.max(wrap.clientWidth,520),height=Math.max(wrap.clientHeight,420),{layer,edges,omitted,perLayer}=graphNeighborhood(),layerValues=[...new Set(layer.values())].sort((a,b)=>a-b),positions=new Map(),nodeW=220,nodeH=58,centerX=width/2,centerY=height/2+18,ringGap=255;
      for(const value of layerValues){
        const ids=[...layer].filter(([,v])=>v===value).map(([id])=>id).sort((a,b)=>connectionCount(nodes.get(b))-connectionCount(nodes.get(a))||nodes.get(a).name.localeCompare(nodes.get(b).name));
        if(value===0){ids.forEach(id=>positions.set(id,{x:centerX,y:centerY}));continue}
